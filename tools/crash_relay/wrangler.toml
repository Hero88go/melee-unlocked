name = "QUOTA"
class_name = "QuotaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaGate"]

# The earlier KV counters (no longer read); kept so a rollback to the previous source still deploys.
[[kv_namespaces]]
