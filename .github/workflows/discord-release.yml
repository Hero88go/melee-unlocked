name: Announce release on Discord

# Posts the three latest published GitHub releases to a Discord channel through a webhook.
# One-time setup by the server owner:
#   1. Discord: Server Settings > Integrations > Webhooks > New Webhook, pick the updates
#      channel, Copy Webhook URL.
#   2. GitHub: repository Settings > Secrets and variables > Actions > New repository secret,
#      name DISCORD_WEBHOOK, value = that URL (or: gh secret set DISCORD_WEBHOOK).
# Nothing is posted until the secret exists.

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release formatter
        uses: actions/checkout@v4
      - name: Post latest three releases to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK secret not set; skipping"; exit 0; fi
          python3 tools/post_discord.py --last 3 --send
